[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sdss-platform2"
version = "0.1.0"
description = "One Map, KLHK, CCKP Climate Data Lake, Vector RAG and GeoAI contracts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
climate = [
  "cftime>=1.6,<2",
  "h5netcdf>=1.3,<2",
  "h5py>=3.11,<4",
  "netCDF4>=1.7,<2",
  "numpy>=1.26,<3",
  "xarray>=2024.7,<2027",
]
geo = [
  "numpy>=1.26,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.1,<3",
]
inference = ["onnxruntime>=1.19,<2"]
storage = ["boto3>=1.35,<2", "psycopg[binary]>=3.2,<4"]
vector = [
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
